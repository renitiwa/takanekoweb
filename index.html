        /* =========================================
           フォント設定（指定のフォントファイルを参照）
           ========================================= */
        @font-face {
            font-family: 'Keifont';
            src: url('keifont.ttf') format('truetype'); 
        }

        /* =========================================
           基本カラーとデザイン（CSS変数）
           ========================================= */
        :root {
            /* ライトモード（デフォルト） */
            --bg-color: #ffffff;
            --text-color: #222222;
            --border-color: #222222;
            --hover-bg: #f8f8f8;
            --card-bg: #ffffff;
            --live-bg: #fff5f5;
            --live-border: #e60000;
            /* カスタムプレイヤー用 */
            --player-bg: #f0f0f0;
            --control-bg: #ffffff;
        }

        /* ダークモード時のカラー設定 */
        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --border-color: #f0f0f0;
            --hover-bg: #2a2a2a;
            --card-bg: #222222;
            --live-bg: #3a1c1c;
            --live-border: #ff4d4d;
            /* カスタムプレイヤー用 */
            --player-bg: #000000;
            --control-bg: #222222;
        }

        body {
            font-family: 'Keifont', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-y: scroll;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ヘッダー */
        header {
            background-color: var(--bg-color);
            border-bottom: 3px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* テーマ切り替えボタン */
        .theme-toggle-btn {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 50px;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .theme-toggle-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* タブ切り替えボタン */
        .tab-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: inherit;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 0px rgba(0,0,0,0.2);
        }

        /* メインコンテンツエリア */
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        /* =========================================
           ライブ配信バナー（カウントダウンエリア）
           ========================================= */
        .live-banner {
            background-color: var(--live-bg);
            border-color: var(--live-border) !important;
            box-shadow: 4px 4px 0px var(--live-border) !important;
            text-align: center;
            padding: 25px 20px;
            margin-bottom: 30px;
            animation: slideDown 0.5s ease;
        }

        .live-banner-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .live-title {
            margin: 0;
            font-size: 20px;
        }

        .countdown-label {
            font-size: 14px;
            color: #666;
        }
        body.dark-mode .countdown-label {
            color: #aaa;
        }

        .countdown-time {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            display: block;
            margin-top: 5px;
        }

        .live-now-text {
            font-size: 32px;
            font-weight: bold;
            color: var(--live-border);
            animation: blink 1.2s infinite;
        }

        .live-btn {
            background-color: var(--live-border) !important;
            border-color: var(--live-border) !important;
            color: #fff !important;
            margin-top: 10px;
            font-size: 18px;
            padding: 12px 30px !important;
        }
        
        .live-btn:hover {
             background-color: #fff !important;
             color: var(--live-border) !important;
        }

        /* =========================================
           カードデザインとアニメーション
           ========================================= */
        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.5s ease forwards;
        }

        .card:hover {
            transform: translate(-2px, -2px) !important;
            box-shadow: 6px 6px 0px var(--border-color);
        }

        .card-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
            border-radius: 8px;
        }

        .card-header:hover {
            background-color: var(--hover-bg);
        }

        /* テキスト系 */
        .term-title, .archive-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .archive-basic-info {
            display: flex;
            flex-direction: column;
        }

        .archive-title {
            margin-bottom: 4px;
        }

        .archive-date {
            font-size: 14px;
            color: #777;
        }
        
        body.dark-mode .archive-date {
            color: #aaa;
        }

        /* 開閉用の矢印 */
        .toggle-icon {
            font-size: 16px;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.26, 1.55);
        }

        .card.open .toggle-icon {
            transform: rotate(180deg);
        }

        /* 詳細エリアのアコーディオン */
        .details-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s ease-out;
            border-top: 0px dashed var(--border-color);
        }

        .card.open .details-wrapper {
            grid-template-rows: 1fr;
            border-top: 2px dashed var(--border-color);
        }

        .details-inner {
            overflow: hidden;
            padding: 0 20px;
        }

        .details-content {
            padding: 20px 0;
        }

        /* サムネイル画像のデザイン */
        .video-thumbnail {
            width: 100%;
            max-width: 480px; 
            height: auto;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            margin: 0 auto 15px auto;
            display: block;
            box-shadow: 2px 2px 0px var(--border-color);
        }

        /* =========================================
           たかねこについて (About) ページ専用
           ========================================= */
        .about-container {
            text-align: center;
            padding: 40px 20px;
        }

        .about-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--border-color);
            margin-bottom: 20px;
            object-fit: cover;
            background-color: var(--hover-bg);
        }

        .about-description {
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .links-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* =========================================
           カスタム動画プレイヤー (たかねこ好きな方へ)
           ========================================= */
        .custom-player-wrapper {
            margin-bottom: 20px;
            padding: 20px;
        }

        .player-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            border-left: 4px solid var(--text-color);
            padding-left: 10px;
        }

        .video-container {
            background-color: var(--player-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 4px 4px 0px var(--border-color);
            position: relative; /* フルスクリーンボタン配置のため */
        }

        .video-element {
            width: 100%;
            display: block;
            /* デフォルトのコントロールは消す */
        }

        .custom-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background-color: var(--control-bg);
            padding: 10px 15px;
            border-top: 2px solid var(--border-color);
        }

        /* 再生・停止などのボタン */
        .ctrl-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* 再生バー */
        .progress-bar-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--text-color);
            border-radius: 50%;
            cursor: pointer;
        }

        /* 速度調整・リピート設定・音量 */
        .ctrl-options {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-between;
            margin-top: 5px;
        }
        
        .ctrl-options-left, .ctrl-options-right {
             display: flex;
             align-items: center;
             gap: 15px;
        }

        .ctrl-select {
            font-family: inherit;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 2px 5px;
            cursor: pointer;
        }

        .repeat-label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
        }
        
        /* 音量スライダー */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .volume-bar {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 6px;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        
        .volume-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--text-color);
            border-radius: 50%;
            cursor: pointer;
        }

        .time-display {
            font-size: 14px;
            min-width: 90px;
            text-align: center;
        }

        /* =========================================
           アクションボタン（共通）
           ========================================= */
        .action-btn {
            display: inline-block;
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            border: 2px solid var(--border-color);
            font-family: inherit;
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 0%; height: 100%;
            background-color: var(--bg-color);
            transition: width 0.3s ease;
            z-index: -1;
        }

        .action-btn:hover::before {
            width: 100%;
        }

        .action-btn:hover {
            color: var(--text-color);
        }

        .clip-container {
            text-align: center;
            display: inline-block;
            margin-top: 15px;
        }

        .clip-time {
            display: block;
            font-size: 13px;
            color: #777;
            margin-top: 5px;
            font-weight: bold;
        }

        body.dark-mode .clip-time {
            color: #aaa;
        }

        /* キーフレーム定義 */
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>

        /* ===================================================================
           【システム処理エリア】
           =================================================================== */

        let countdownInterval;
        const audioContexts = {}; // 音量増幅用のAudioContextを保存

        document.addEventListener('DOMContentLoaded', () => {
            renderTerms();
            renderArchives();
            renderLocalVideos();
            loadTheme();
            updateLiveBanner();
            if(nextLiveConfig.date) {
                countdownInterval = setInterval(updateLiveBanner, 1000);
            }
        });

        // テーマ（ダークモード）切り替え処理
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('theme-toggle');
            
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                btn.textContent = '☀️ ライト';
                localStorage.setItem('theme', 'dark');
            } else {
                btn.textContent = '🌙 ダーク';
                localStorage.setItem('theme', 'light');
            }
        }

        // 保存されたテーマを適用
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle').textContent = '☀️ ライト';
            }
        }

        // タブ切り替え処理
        function switchTab(tabId) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            // タブを切り替えたらすべてのローカル動画を一時停止する
            document.querySelectorAll('.video-element').forEach(video => {
                video.pause();
                const btn = video.parentElement.querySelector('.play-pause-btn');
                if(btn) btn.textContent = '▶ 再生';
            });
        }

        // YouTube URLから動画IDを抽出
        function getYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|live\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // ライブ配信バナー
        function updateLiveBanner() {
            const banner = document.getElementById('live-banner');
            const titleElem = document.getElementById('live-title');
            const statusElem = document.getElementById('live-status');
            const linkBtn = document.getElementById('live-link-btn');

            if (!nextLiveConfig.date) {
                banner.style.display = 'none';
                return;
            }

            const liveDateStr = nextLiveConfig.date.replace(/-/g, '/');
            const liveDate = new Date(liveDateStr).getTime();
            const now = new Date().getTime();
            const diff = liveDate - now;

            // 3時間半 = 3.5 * 60 * 60 * 1000 = 12,600,000ミリ秒
            const threeHalfHours = 3.5 * 60 * 60 * 1000;

            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                
                const dStr = String(d).padStart(2, '0');
                const hStr = String(h).padStart(2, '0');
                const mStr = String(m).padStart(2, '0');
                const sStr = String(s).padStart(2, '0');
                
                const timeStr = `${dStr}:${hStr}:${mStr}:${sStr}`;
                
                titleElem.innerText = nextLiveConfig.title;
                statusElem.innerHTML = `<span class="countdown-label">次のライブ配信まで</span><span class="countdown-time">${timeStr}</span>`;
                linkBtn.href = nextLiveConfig.url;
                banner.style.display = 'block';

            } else if (diff <= 0 && diff > -threeHalfHours) {
                titleElem.innerText = nextLiveConfig.title;
                statusElem.innerHTML = `<span class="live-now-text">🔴 LIVE NOW</span>`;
                linkBtn.href = nextLiveConfig.url;
                banner.style.display = 'block';

            } else {
                banner.style.display = 'none';
                clearInterval(countdownInterval);
            }
        }

        // 用語辞典の描画
        function renderTerms() {
            const container = document.getElementById('terms-container');
            container.innerHTML = termsData.map((data, index) => {
                const delay = index * 0.1;
                
                let clipHtml = '';
                if (data.clipUrl) {
                    const videoId = getYouTubeId(data.clipUrl);
                    const thumbnailHtml = videoId 
                        ? `<img src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" alt="サムネイル" class="video-thumbnail" onerror="this.src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg'">` 
                        : '';
                        
                    clipHtml = `
                        ${thumbnailHtml}
                        <div class="clip-container">
                            <a href="${data.clipUrl}" target="_blank" class="action-btn">切り抜き動画を見る</a>
                            <span class="clip-time">(${data.clipSeconds})</span>
                        </div>
                    `;
                }

                return `
                    <div class="card" style="animation-delay: ${delay}s">
                        <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                            <span class="term-title">${data.term}</span>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="details-wrapper">
                            <div class="details-inner">
                                <div class="details-content">
                                    <p><strong>説明：</strong><br>${data.explanation}</p>
                                    <p><strong>登場した配信：</strong> ${data.streamName}</p>
                                    ${clipHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // アーカイブの描画
        function renderArchives() {
            const container = document.getElementById('archives-container');
            container.innerHTML = archivesData.map((data, index) => {
                const delay = index * 0.1;
                const descText = data.explanation ? data.explanation : "説明はありません。";
                
                const videoId = getYouTubeId(data.streamUrl);
                const thumbnailHtml = videoId 
                    ? `<img src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" alt="サムネイル" class="video-thumbnail" onerror="this.src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg'">` 
                    : '';

                return `
                    <div class="card" style="animation-delay: ${delay}s">
                        <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                            <div class="archive-basic-info">
                                <span class="archive-title">${data.title}</span>
                                <span class="archive-date">${data.date}</span>
                            </div>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="details-wrapper">
                            <div class="details-inner">
                                <div class="details-content">
                                    ${thumbnailHtml}
                                    <p><strong>ゲーム名：</strong> ${data.game}</p>
                                    <p><strong>説明：</strong><br>${descText}</p>
                                    <div style="text-align: center; margin-top: 20px;">
                                        <a href="${data.streamUrl}" target="_blank" class="action-btn">本編配信を見に行く</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // ローカル動画プレイヤーの構築と制御
        // ==========================================
        function renderLocalVideos() {
            const container = document.getElementById('local-videos-container');
            
            if(videosData.length === 0) {
                container.innerHTML = "<p>現在公開されている動画はありません。</p>";
                return;
            }

            container.innerHTML = videosData.map((video, index) => {
                const delay = index * 0.1;
                const playerId = `player-${index}`;
                
                return `
                    <div class="card custom-player-wrapper" style="animation-delay: ${delay}s">
                        <div class="player-title">${video.title}</div>
                        <div class="video-container">
                            <video id="${playerId}" class="video-element" src="${video.filename}"></video>
                            
                            <!-- カスタムコントローラー -->
                            <div class="custom-controls" id="controls-${playerId}">
                                <button class="ctrl-btn play-pause-btn" onclick="togglePlay('${playerId}')">▶ 再生</button>
                                
                                <div class="progress-bar-container">
                                    <span class="time-display" id="current-time-${playerId}">00:00</span>
                                    <input type="range" class="progress-bar" id="progress-${playerId}" value="0" min="0" max="100" step="0.1" oninput="seekVideo('${playerId}', this.value)">
                                    <span class="time-display" id="duration-${playerId}">00:00</span>
                                </div>
                                
                                <div class="ctrl-options">
                                    <div class="ctrl-options-left">
                                        <select class="ctrl-select" onchange="changeSpeed('${playerId}', this.value)">
                                            <option value="0.1">0.1x</option>
                                            <option value="0.25">0.25x</option>
                                            <option value="0.5">0.5x</option>
                                            <option value="0.75">0.75x</option>
                                            <option value="1" selected>1.0x (標準)</option>
                                            <option value="1.25">1.25x</option>
                                            <option value="1.5">1.5x</option>
                                            <option value="2">2.0x</option>
                                            <option value="3">3.0x</option>
                                            <option value="5">5.0x</option>
                                        </select>
                                        <label class="repeat-label">
                                            <input type="checkbox" onchange="toggleLoop('${playerId}', this.checked)">
                                            リピート
                                        </label>
                                    </div>
                                    <div class="ctrl-options-right">
                                        <div class="volume-container">
                                            🔊 <input type="range" class="volume-bar" id="volume-${playerId}" value="1" min="0" max="2" step="0.1" oninput="changeVolume('${playerId}', this.value)">
                                            <span id="volume-text-${playerId}" style="width: 35px; text-align: right;">1.0x</span>
                                        </div>
                                        <button class="ctrl-btn" onclick="toggleFullScreen('${playerId}')">⛶ 全画面</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 各動画のイベントリスナーを設定
            videosData.forEach((_, index) => {
                const playerId = `player-${index}`;
                const video = document.getElementById(playerId);
                const progressBar = document.getElementById(`progress-${playerId}`);
                const currentDisplay = document.getElementById(`current-time-${playerId}`);
                const durationDisplay = document.getElementById(`duration-${playerId}`);
                const playBtn = video.parentElement.querySelector('.play-pause-btn');

                video.addEventListener('loadedmetadata', () => {
                    durationDisplay.textContent = formatTime(video.duration);
                });

                video.addEventListener('timeupdate', () => {
                    if (!video.duration) return;
                    const percent = (video.currentTime / video.duration) * 100;
                    progressBar.value = percent;
                    currentDisplay.textContent = formatTime(video.currentTime);
                });

                video.addEventListener('ended', () => {
                    if(!video.loop) {
                        playBtn.textContent = '▶ 再生';
                    }
                });
                
                // フルスクリーン変更時の制御（標準コントローラーのオンオフ）
                video.addEventListener('fullscreenchange', () => handleFullscreenChange(video));
                video.addEventListener('webkitfullscreenchange', () => handleFullscreenChange(video));
                video.addEventListener('mozfullscreenchange', () => handleFullscreenChange(video));
                video.addEventListener('MSFullscreenChange', () => handleFullscreenChange(video));
            });
        }

        // 時間フォーマット関数 (例: 65秒 -> 01:05)
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // 再生・一時停止の切り替え
        function togglePlay(playerId) {
            const video = document.getElementById(playerId);
            const btn = document.getElementById(`controls-${playerId}`).querySelector('.play-pause-btn');
            
            // 初回再生時にAudioContextを作成して音量増幅機能を有効化
            initAudioContext(playerId);
            
            if (video.paused) {
                video.play();
                btn.textContent = '⏸ 一時停止';
            } else {
                video.pause();
                btn.textContent = '▶ 再生';
            }
        }

        // 音量増幅用のWeb Audio API初期化
        function initAudioContext(playerId) {
            if (audioContexts[playerId]) return; // 既に作成済みなら何もしない
            
            try {
                const video = document.getElementById(playerId);
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const source = ctx.createMediaElementSource(video);
                const gainNode = ctx.createGain();
                
                // 現在のスライダー値を取得して適用
                const currentVol = document.getElementById(`volume-${playerId}`).value;
                gainNode.gain.value = parseFloat(currentVol);
                
                source.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                audioContexts[playerId] = { ctx, gainNode };
            } catch (e) {
                console.error("Audio APIの初期化に失敗しました", e);
            }
        }

        // 音量の変更 (0〜2倍)
        function changeVolume(playerId, value) {
            const textDisplay = document.getElementById(`volume-text-${playerId}`);
            textDisplay.textContent = parseFloat(value).toFixed(1) + "x";
            
            // Web Audio APIが初期化されていればGainを調整
            if (audioContexts[playerId]) {
                audioContexts[playerId].gainNode.gain.value = parseFloat(value);
            } else {
                // まだ再生されておらず初期化されていない場合は、1以下の時だけ標準APIで調整
                const video = document.getElementById(playerId);
                video.volume = value > 1 ? 1 : value;
            }
        }

        // シークバー（再生位置）の変更
        function seekVideo(playerId, value) {
            const video = document.getElementById(playerId);
            if (!video.duration) return;
            const newTime = video.duration * (value / 100);
            video.currentTime = newTime;
        }

        // 再生速度の変更
        function changeSpeed(playerId, speed) {
            const video = document.getElementById(playerId);
            video.playbackRate = parseFloat(speed);
        }

        // リピートの切り替え
        function toggleLoop(playerId, isLoop) {
            const video = document.getElementById(playerId);
            video.loop = isLoop;
        }
        
        // 全画面表示の切り替え
        function toggleFullScreen(playerId) {
            const video = document.getElementById(playerId);
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) { /* Safari */
                video.webkitRequestFullscreen();
            } else if (video.msRequestFullscreen) { /* IE11 */
                video.msRequestFullscreen();
            }
        }
        
        // 全画面時のみ標準コントローラーを表示する処理
        function handleFullscreenChange(video) {
            const isFullscreen = document.fullscreenElement === video || 
                                 document.webkitFullscreenElement === video || 
                                 document.mozFullScreenElement === video ||
                                 document.msFullscreenElement === video;
                                 
            if (isFullscreen) {
                video.controls = true; // 全画面時は標準のコントロールを表示
            } else {
                video.controls = false; // 元に戻ったらカスタムコントロールを使うので非表示
            }
        }

    </script>
