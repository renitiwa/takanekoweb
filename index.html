           フォント設定（指定のフォントファイルを参照）
           ========================================= */
        @font-face {
            font-family: 'Keifont';
            src: url('keifont.ttf') format('truetype'); 
        }

        /* =========================================
           基本カラーとデザイン（CSS変数）
           ========================================= */
        :root {
            /* ライトモード（デフォルト） */
            --bg-color: #ffffff;
            --text-color: #222222;
            --border-color: #222222;
            --hover-bg: #f8f8f8;
            --card-bg: #ffffff;
            --live-bg: #fff5f5;
            --live-border: #e60000;
        }

        /* ダークモード時のカラー設定 */
        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --border-color: #f0f0f0;
            --hover-bg: #2a2a2a;
            --card-bg: #222222;
            --live-bg: #3a1c1c;
            --live-border: #ff4d4d;
        }

        body {
            font-family: 'Keifont', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-y: scroll;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ヘッダー */
        header {
            background-color: var(--bg-color);
            border-bottom: 3px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* テーマ切り替えボタン */
        .theme-toggle-btn {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 50px;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .theme-toggle-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* タブ切り替えボタン */
        .tab-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: inherit;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 0px rgba(0,0,0,0.2);
        }

        /* メインコンテンツエリア */
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        /* =========================================
           ライブ配信バナー（カウントダウンエリア）
           ========================================= */
        .live-banner {
            background-color: var(--live-bg);
            border-color: var(--live-border) !important;
            box-shadow: 4px 4px 0px var(--live-border) !important;
            text-align: center;
            padding: 25px 20px;
            margin-bottom: 30px;
            animation: slideDown 0.5s ease;
        }

        .live-banner-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .live-title {
            margin: 0;
            font-size: 20px;
        }

        .countdown-label {
            font-size: 14px;
            color: #666;
        }
        body.dark-mode .countdown-label {
            color: #aaa;
        }

        .countdown-time {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            display: block;
            margin-top: 5px;
        }

        .live-now-text {
            font-size: 32px;
            font-weight: bold;
            color: var(--live-border);
            animation: blink 1.2s infinite;
        }

        .live-btn {
            background-color: var(--live-border) !important;
            border-color: var(--live-border) !important;
            color: #fff !important;
            margin-top: 10px;
            font-size: 18px;
            padding: 12px 30px !important;
        }
        
        .live-btn:hover {
             background-color: #fff !important;
             color: var(--live-border) !important;
        }

        /* =========================================
           カードデザインとアニメーション
           ========================================= */
        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.5s ease forwards;
        }

        .card:hover {
            transform: translate(-2px, -2px) !important;
            box-shadow: 6px 6px 0px var(--border-color);
        }

        .card-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
            border-radius: 8px;
        }

        .card-header:hover {
            background-color: var(--hover-bg);
        }

        /* テキスト系 */
        .term-title, .archive-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .archive-basic-info {
            display: flex;
            flex-direction: column;
        }

        .archive-title {
            margin-bottom: 4px;
        }

        .archive-date {
            font-size: 14px;
            color: #777;
        }
        
        body.dark-mode .archive-date {
            color: #aaa;
        }

        /* 開閉用の矢印 */
        .toggle-icon {
            font-size: 16px;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.26, 1.55);
        }

        .card.open .toggle-icon {
            transform: rotate(180deg);
        }

        /* 詳細エリアのアコーディオン */
        .details-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s ease-out;
            border-top: 0px dashed var(--border-color);
        }

        .card.open .details-wrapper {
            grid-template-rows: 1fr;
            border-top: 2px dashed var(--border-color);
        }

        .details-inner {
            overflow: hidden;
            padding: 0 20px;
        }

        .details-content {
            padding: 20px 0;
        }

        /* =========================================
           たかねこについて (About) ページ専用
           ========================================= */
        .about-container {
            text-align: center;
            padding: 40px 20px;
        }

        .about-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--border-color);
            margin-bottom: 20px;
            object-fit: cover;
            background-color: var(--hover-bg);
        }

        .about-description {
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .links-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* =========================================
           アクションボタン
           ========================================= */
        .action-btn {
            display: inline-block;
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            border: 2px solid var(--border-color);
            font-family: inherit;
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 0%; height: 100%;
            background-color: var(--bg-color);
            transition: width 0.3s ease;
            z-index: -1;
        }

        .action-btn:hover::before {
            width: 100%;
        }

        .action-btn:hover {
            color: var(--text-color);
        }

        .clip-container {
            text-align: center;
            display: inline-block;
            margin-top: 15px;
        }

        .clip-time {
            display: block;
            font-size: 13px;
            color: #777;
            margin-top: 5px;
            font-weight: bold;
        }

        body.dark-mode .clip-time {
            color: #aaa;
        }

        /* キーフレーム定義 */
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>

        // テーマ（ダークモード）切り替え処理
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('theme-toggle');
            
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                btn.textContent = '☀️ ライト';
                localStorage.setItem('theme', 'dark');
            } else {
                btn.textContent = '🌙 ダーク';
                localStorage.setItem('theme', 'light');
            }
        }

        // 保存されたテーマを適用する処理
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle').textContent = '☀️ ライト';
            }
        }

        // ライブ配信バナーを制御する関数
        function updateLiveBanner() {
            const banner = document.getElementById('live-banner');
            const titleElem = document.getElementById('live-title');
            const statusElem = document.getElementById('live-status');
            const linkBtn = document.getElementById('live-link-btn');

            // 設定が空の場合は非表示
            if (!nextLiveConfig.date) {
                banner.style.display = 'none';
                return;
            }

            const liveDate = new Date(nextLiveConfig.date).getTime();
            const now = new Date().getTime();
            const diff = liveDate - now;

            // 3時間 = 10,800,000ミリ秒
            const threeHours = 3 * 60 * 60 * 1000;

            if (diff > 0) {
                // カウントダウン中
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                
                let timeStr = "";
                if (d > 0) timeStr += d + "日 ";
                timeStr += `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                
                titleElem.innerText = nextLiveConfig.title;
                statusElem.innerHTML = `<span class="countdown-label">次のライブ配信まで</span><span class="countdown-time">${timeStr}</span>`;
                linkBtn.href = nextLiveConfig.url;
                banner.style.display = 'block';

            } else if (diff <= 0 && diff > -threeHours) {
                // LIVE NOW (配信時間から3時間以内)
                titleElem.innerText = nextLiveConfig.title;
                statusElem.innerHTML = `<span class="live-now-text">🔴 LIVE NOW</span>`;
                linkBtn.href = nextLiveConfig.url;
                banner.style.display = 'block';

            } else {
                // 3時間経過後は非表示にして、更新タイマーも停止
                banner.style.display = 'none';
                clearInterval(countdownInterval);
            }
        }

        // 用語辞典を描画する関数
        function renderTerms() {
            const container = document.getElementById('terms-container');
            container.innerHTML = termsData.map((data, index) => {
                const delay = index * 0.1;
                const clipButtonHtml = data.clipUrl ? `
                    <div class="clip-container">
                        <a href="${data.clipUrl}" target="_blank" class="action-btn">切り抜き動画を見る</a>
                        <span class="clip-time">(${data.clipSeconds})</span>
                    </div>
                ` : '';

                return `
                    <div class="card" style="animation-delay: ${delay}s">
                        <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                            <span class="term-title">${data.term}</span>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="details-wrapper">
                            <div class="details-inner">
                                <div class="details-content">
                                    <p><strong>説明：</strong><br>${data.explanation}</p>
                                    <p><strong>登場した配信：</strong> ${data.streamName}</p>
                                    ${clipButtonHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // アーカイブを描画する関数
        function renderArchives() {
            const container = document.getElementById('archives-container');
            container.innerHTML = archivesData.map((data, index) => {
                const delay = index * 0.1;
                const descText = data.explanation ? data.explanation : "説明はありません。";

                return `
                    <div class="card" style="animation-delay: ${delay}s">
                        <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                            <div class="archive-basic-info">
                                <span class="archive-title">${data.title}</span>
                                <span class="archive-date">${data.date}</span>
                            </div>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="details-wrapper">
                            <div class="details-inner">
                                <div class="details-content">
                                    <p><strong>ゲーム名：</strong> ${data.game}</p>
                                    <p><strong>説明：</strong><br>${descText}</p>
                                    <div style="text-align: center; margin-top: 20px;">
                                        <a href="${data.streamUrl}" target="_blank" class="action-btn">本編配信を見に行く</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
