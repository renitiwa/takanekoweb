<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たかねこ用語辞典 ＆ アーカイブ</title>
    <style>
        /* =========================================
           フォント設定
           ========================================= */
        @font-face {
            font-family: 'Keifont';
            src: url('keifont.ttf') format('truetype'); 
        }

        /* =========================================
           基本カラーとデザイン
           ========================================= */
        :root {
            /* ライトモード（デフォルト） */
            --bg-color: #ffffff;
            --text-color: #222222;
            --border-color: #222222;
            --hover-bg: #f8f8f8;
            --card-bg: #ffffff;
            --live-bg: #fff5f5;
            --live-border: #e60000;
            --player-bg: #f0f0f0;
            --control-bg: #ffffff;
        }

        /* ダークモード時のカラー設定 */
        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --border-color: #f0f0f0;
            --hover-bg: #2a2a2a;
            --card-bg: #222222;
            --live-bg: #3a1c1c;
            --live-border: #ff4d4d;
            --player-bg: #000000;
            --control-bg: #222222;
        }

        /* スマホでのタップ時の青いハイライトを消す */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Keifont', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-y: scroll;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ヘッダー */
        header {
            background-color: var(--bg-color);
            border-bottom: 3px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideDown 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .theme-toggle-btn {
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            border-radius: 50px;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: inherit;
            user-select: none; 
            -webkit-user-select: none;
            min-height: 44px; /* スマホでのタッチ判定を大きく */
        }

        /* PC等ホバー対応端末のみホバーエフェクトを適用（スマホでの引っかかり防止） */
        @media (hover: hover) {
            .theme-toggle-btn:hover {
                background-color: var(--text-color);
                color: var(--bg-color);
            }
            .tab-btn:hover {
                background-color: var(--text-color);
                color: var(--bg-color);
                transform: translateY(-2px);
                box-shadow: 0 4px 0px rgba(0,0,0,0.2);
            }
            .card:hover {
                transform: translate(-2px, -2px) !important;
                box-shadow: 6px 6px 0px var(--border-color);
            }
            .card-header:hover {
                background-color: var(--hover-bg);
            }
            .video-thumbnail:hover, .collection-img:hover, .gacha-item:hover {
                opacity: 0.8;
                transform: scale(1.05);
            }
            .action-btn:hover::before {
                width: 100%;
            }
            .action-btn:hover {
                color: var(--text-color);
            }
            .live-btn:hover {
                background-color: #fff !important;
                color: var(--live-border) !important;
            }
            .live-banner.investigating .live-btn:hover {
                background-color: #fff !important;
                color: #0066cc !important;
            }
            body.dark-mode .live-banner.investigating .live-btn:hover {
                background-color: #000 !important;
                color: #3399ff !important;
            }
            .ctrl-btn:hover {
                background-color: var(--text-color);
                color: var(--bg-color);
            }
            .img-modal-close:hover {
                color: #ff4d4d;
            }
        }

        .tab-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .tab-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: inherit;
            min-height: 44px; /* タッチしやすく */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-btn.active {
            background-color: var(--text-color);
            color: var(--bg-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 0px rgba(0,0,0,0.2);
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        /* ライブ配信バナー */
        .live-banner {
            background-color: var(--live-bg);
            border-color: var(--live-border) !important;
            box-shadow: 4px 4px 0px var(--live-border) !important;
            text-align: center;
            padding: 25px 20px;
            margin-bottom: 30px;
            animation: slideDown 0.5s ease;
        }
        
        .live-banner.investigating {
            background-color: #f0f8ff;
            border-color: #0066cc !important;
            box-shadow: 4px 4px 0px #0066cc !important;
        }
        body.dark-mode .live-banner.investigating {
            background-color: #001a33;
            border-color: #3399ff !important;
            box-shadow: 4px 4px 0px #3399ff !important;
        }

        .live-banner-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .live-title {
            margin: 0;
            font-size: 20px;
        }

        .countdown-label {
            font-size: 14px;
            color: #666;
        }
        body.dark-mode .countdown-label {
            color: #aaa;
        }

        .countdown-time {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            display: block;
            margin-top: 5px;
        }
        
        /* 自由に配置できるテキスト */
        .live-message {
            font-size: 15px;
            font-weight: bold;
            margin: 5px 0;
            color: var(--text-color);
        }

        .live-now-text {
            font-size: 32px;
            font-weight: bold;
            color: var(--live-border);
            animation: blink 1.2s infinite;
        }
        
        .investigating-text {
            font-size: 32px;
            font-weight: bold;
            color: #0066cc;
            margin-top: 5px;
        }
        body.dark-mode .investigating-text {
            color: #3399ff;
        }

        .live-btn {
            background-color: var(--live-border) !important;
            border-color: var(--live-border) !important;
            color: #fff !important;
            margin-top: 5px;
            font-size: 18px;
            padding: 12px 30px !important;
        }
        
        .live-banner.investigating .live-btn {
            background-color: #0066cc !important;
            border-color: #0066cc !important;
        }
        body.dark-mode .live-banner.investigating .live-btn {
            background-color: #3399ff !important;
            border-color: #3399ff !important;
        }

        /* アーカイブ フィルター */
        .archive-filter-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
        }
        .archive-filter-container select {
            font-family: inherit;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
        }

        /* カード共通 */
        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.5s ease forwards;
        }

        .card-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
            border-radius: 8px;
        }

        .term-title, .archive-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .archive-basic-info {
            display: flex;
            flex-direction: column;
        }

        .archive-title { margin-bottom: 4px; }
        .archive-date { font-size: 14px; color: #777; }
        body.dark-mode .archive-date { color: #aaa; }

        .toggle-icon {
            font-size: 16px;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.26, 1.55);
        }
        .card.open .toggle-icon { transform: rotate(180deg); }

        .details-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s ease-out;
            border-top: 0px dashed var(--border-color);
        }
        .card.open .details-wrapper {
            grid-template-rows: 1fr;
            border-top: 2px dashed var(--border-color);
        }
        .details-inner { overflow: hidden; padding: 0 20px; }
        .details-content { padding: 20px 0; }

        /* 画像 (拡大対応クラス付き) */
        .video-thumbnail {
            width: 100%;
            max-width: 480px; 
            height: auto;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            margin: 0 auto 15px auto;
            display: block;
            box-shadow: 2px 2px 0px var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        /* たかねこについて */
        .about-container { text-align: center; padding: 40px 20px; }
        .about-icon {
            width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--border-color);
            margin-bottom: 20px; object-fit: cover; background-color: var(--hover-bg);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .about-icon:hover { transform: scale(1.05); }
        .about-description { margin-bottom: 30px; font-size: 16px; line-height: 1.8; max-width: 600px; margin-left: auto; margin-right: auto; }
        .links-wrapper { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

        /* カスタム動画プレイヤー */
        .custom-player-wrapper { margin-bottom: 20px; padding: 20px; }
        .player-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-left: 4px solid var(--text-color); padding-left: 10px; }
        .video-container { background-color: var(--player-bg); border: 2px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 4px 4px 0px var(--border-color); position: relative; }
        .video-element { width: 100%; display: block; }
        .custom-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background-color: var(--control-bg); padding: 10px 15px; border-top: 2px solid var(--border-color); }
        .ctrl-btn { background-color: var(--bg-color); color: var(--text-color); border: 2px solid var(--border-color); padding: 5px 15px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 14px; transition: all 0.2s; min-height: 44px; }
        .progress-bar-container { flex-grow: 1; display: flex; align-items: center; gap: 10px; min-width: 200px; }
        .progress-bar, .volume-bar { -webkit-appearance: none; appearance: none; background: var(--hover-bg); border: 1px solid var(--border-color); border-radius: 4px; outline: none; cursor: pointer; }
        .progress-bar { width: 100%; height: 8px; }
        .volume-bar { width: 80px; height: 6px; }
        .progress-bar::-webkit-slider-thumb, .volume-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; background: var(--text-color); border-radius: 50%; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { width: 16px; height: 16px; }
        .volume-bar::-webkit-slider-thumb { width: 12px; height: 12px; }
        .ctrl-options { display: flex; align-items: center; gap: 15px; font-size: 14px; flex-wrap: wrap; width: 100%; justify-content: space-between; margin-top: 5px; }
        .ctrl-options-left, .ctrl-options-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .ctrl-select { font-family: inherit; background-color: var(--bg-color); color: var(--text-color); border: 2px solid var(--border-color); border-radius: 4px; padding: 2px 5px; cursor: pointer; min-height: 40px; }
        .repeat-label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
        .volume-container { display: flex; align-items: center; gap: 5px; }
        .time-display { font-size: 14px; min-width: 80px; text-align: center; }

        /* アクションボタン（共通） */
        .action-btn { display: inline-block; background-color: var(--text-color); color: var(--bg-color); padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 6px; text-align: center; cursor: pointer; border: 2px solid var(--border-color); font-family: inherit; position: relative; overflow: hidden; z-index: 1; transition: color 0.3s ease; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
        .action-btn::before { content: ''; position: absolute; top: 0; left: 0; width: 0%; height: 100%; background-color: var(--bg-color); transition: width 0.3s ease; z-index: -1; }
        .clip-container { text-align: center; display: inline-block; margin-top: 15px; }
        .clip-time { display: block; font-size: 13px; color: #777; margin-top: 5px; font-weight: bold; }
        body.dark-mode .clip-time { color: #aaa; }


        /* =========================================
           たかねこガチャ用デザイン
           ========================================= */
        .gacha-container { text-align: center; padding: 20px; }
        .pt-display {
            font-size: 24px; font-weight: bold; margin-bottom: 20px; padding: 15px;
            border: 3px solid var(--border-color); border-radius: 8px;
            background-color: var(--hover-bg); display: inline-block;
        }
        .gacha-btns { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .gacha-btn {
            font-size: 20px; padding: 15px 30px; border-radius: 8px; cursor: pointer;
            font-family: inherit; font-weight: bold; border: 3px solid var(--border-color);
            background-color: var(--bg-color); color: var(--text-color);
            transition: transform 0.1s, box-shadow 0.1s; box-shadow: 4px 4px 0px var(--border-color);
            min-height: 60px;
        }
        .gacha-btn:active { transform: translate(4px, 4px) !important; box-shadow: 0px 0px 0px var(--border-color) !important; }
        .gacha-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #gacha-result-area {
            display: none; margin-top: 20px; padding: 20px; border: 2px dashed var(--border-color);
            border-radius: 8px; background-color: var(--card-bg); animation: fadeIn 0.5s ease;
        }
        .gacha-result-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 15px; }
        .gacha-item {
            width: 120px; height: 120px; border: 2px solid var(--border-color); border-radius: 8px;
            object-fit: cover; background-color: #eee; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; transform: scale(0.5); cursor: pointer; transition: transform 0.2s, opacity 0.2s;
        }
        .gacha-item-title { font-size: 12px; margin-top: 5px; font-weight: bold; }
        .gacha-item-wrapper { display: flex; flex-direction: column; align-items: center; }
        
        #collection-area { display: none; margin-top: 30px; padding-top: 20px; border-top: 3px solid var(--border-color); }
        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; margin-top: 20px; }
        .collection-img {
            width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border: 2px solid var(--border-color);
            border-radius: 8px; transition: transform 0.2s; cursor: pointer;
        }
        .collection-locked {
            width: 100%; aspect-ratio: 1 / 1; background-color: #ccc; border: 2px dashed var(--border-color);
            border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #666;
        }

        .complete-message {
            font-size: 24px; font-weight: bold; color: var(--live-border); margin-top: 30px;
            animation: fadeIn 1s ease; text-align: center;
        }

        /* =========================================
           ポップアップ(モーダル)＆画像拡大
           ========================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; transition: opacity 0.3s;
        }
        .modal-content {
            background-color: var(--bg-color); color: var(--text-color); padding: 30px;
            border: 4px solid var(--border-color); border-radius: 12px; text-align: center;
            max-width: 400px; width: 90%; transform: translateY(-20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-overlay.show .modal-content { transform: translateY(0); }

        /* 画像拡大用オーバーレイ */
        .img-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; transition: opacity 0.3s ease;
        }
        .img-modal-overlay.show { display: flex; opacity: 1; }
        .img-modal-content {
            max-width: 90%; max-height: 90%; border: 4px solid #fff; border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            object-fit: contain;
        }
        .img-modal-overlay.show .img-modal-content { transform: scale(1); }
        .img-modal-close {
            position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); transition: color 0.2s;
        }

        /* 開発者モード設定パネル */
        #dev-settings {
            display: none; margin-top: 30px; padding: 20px; border: 3px solid #e60000;
            background-color: #fff5f5; color: #000; border-radius: 8px; text-align: left;
        }
        #dev-settings h3 { margin-top: 0; color: #e60000; }
        .dev-control { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;}

        /* スマホ向けレスポンシブ調整 */
        @media (max-width: 600px) {
            header { padding: 10px; flex-direction: column; align-items: stretch; }
            .header-left { justify-content: space-between; }
            .tab-nav { flex-wrap: wrap; justify-content: center; }
            .tab-btn { flex: 1 1 30%; font-size: 14px; padding: 10px 5px; }
            .live-banner { padding: 15px 10px; }
            .countdown-time, .live-now-text, .investigating-text { font-size: 24px; }
            .ctrl-options { flex-direction: column; align-items: stretch; }
            .ctrl-options-left, .ctrl-options-right { justify-content: space-between; }
            .gacha-item { width: 90px; height: 90px; }
            .collection-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
        }

        @keyframes popIn { to { opacity: 1; transform: scale(1); } }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>たかねこ辞典＆アーカイブ</h1>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="handleThemeToggleClick()">🌙 ダーク</button>
        </div>
        <div class="tab-nav">
            <!-- 変更点: イベントターゲットのズレを防ぐため、引数に this を渡すように変更 -->
            <button class="tab-btn active" onclick="switchTab('glossary', this)">用語辞典</button>
            <button class="tab-btn" onclick="switchTab('archive', this)">アーカイブ</button>
            <button class="tab-btn" onclick="switchTab('for_fans', this)">たかねこ好きな方へ</button>
            <button class="tab-btn" onclick="switchTab('gacha', this)">たかねこガチャ</button>
            <button class="tab-btn" onclick="switchTab('about', this)">たかねこについて</button>
        </div>
    </header>

    <main>
        <!-- ライブ配信バナー -->
        <div id="live-banner" class="card live-banner" style="display: none;">
            <div class="live-banner-inner">
                <h2 id="live-title" class="live-title"></h2>
                <div id="live-status"></div>
                <a id="live-link-btn" href="#" target="_blank" class="action-btn live-btn">配信を見る</a>
            </div>
        </div>

        <!-- 用語辞典 -->
        <section id="glossary" class="page-section active">
            <div id="terms-container"></div>
        </section>

        <!-- アーカイブ -->
        <section id="archive" class="page-section">
            <!-- 追加: ゲーム絞り込みフィルター -->
            <div class="archive-filter-container">
                <label for="archive-filter"><b>絞り込み:</b></label>
                <select id="archive-filter" onchange="renderArchives(this.value)">
                    <option value="all">すべてのゲーム</option>
                </select>
            </div>
            <div id="archives-container"></div>
        </section>

        <!-- たかねこ好きな方へ (ローカル動画エリア) -->
        <section id="for_fans" class="page-section">
            <div id="local-videos-container"></div>
        </section>

        <!-- たかねこガチャ -->
        <section id="gacha" class="page-section">
            <div class="card" style="animation-delay: 0s;">
                <div class="gacha-container">
                    <h2>🐾 たかねこガチャ 🐾</h2>

        /* --- ライブ配信バナー --- */
        function updateLiveBanner() {
            const banner = document.getElementById('live-banner');
            const titleElem = document.getElementById('live-title');
            const statusElem = document.getElementById('live-status');
            const linkBtn = document.getElementById('live-link-btn');

            if (!nextLiveConfig.status || nextLiveConfig.status === "") { 
                banner.style.display = 'none'; 
                if (countdownInterval) clearInterval(countdownInterval);
                return; 
            }
            
            // 追加テキストの生成
            const messageHtml = nextLiveConfig.message 
                ? `<div class="live-message">${nextLiveConfig.message}</div>` 
                : '';
            
            if (nextLiveConfig.status === "investigating") {
                banner.classList.add("investigating");
                titleElem.innerText = nextLiveConfig.title;
                statusElem.innerHTML = `<span class="investigating-text">🔵 調査中</span>${messageHtml}`;
                linkBtn.href = nextLiveConfig.url;
                banner.style.display = 'block';
                if (countdownInterval) clearInterval(countdownInterval);
                return;
            }

            banner.classList.remove("investigating");
            const liveDateStr = nextLiveConfig.date.replace(/-/g, '/');
            const liveDate = new Date(liveDateStr).getTime();
            const now = new Date().getTime();
            const diff = liveDate - now;
            const threeHalfHours = 3.5 * 60 * 60 * 1000;

            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                const timeStr = `${String(d).padStart(2, '0')}:${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                
                titleElem.innerText = nextLiveConfig.title;
                statusElem.innerHTML = `<span class="countdown-label">次のライブ配信まで</span><span class="countdown-time">${timeStr}</span>${messageHtml}`;
                linkBtn.href = nextLiveConfig.url;
                banner.style.display = 'block';
            } else if (diff <= 0 && diff > -threeHalfHours) {
                titleElem.innerText = nextLiveConfig.title;
                statusElem.innerHTML = `<span class="live-now-text">🔴 LIVE NOW</span>${messageHtml}`;
                linkBtn.href = nextLiveConfig.url;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
                clearInterval(countdownInterval);
            }
        }

        /* --- ガチャシステム --- */
        function checkDailyLogin() {
            const today = new Date().toDateString();
            const lastLogin = localStorage.getItem('lastLoginDate');
            
            if (lastLogin !== today) {

        function updateGachaDisplay() {
            document.getElementById('pt-amount').innerText = takanekoPoints;
            document.getElementById('btn-gacha-1').disabled = (takanekoPoints < COST_1 || gachaImages.length === 0);
            document.getElementById('btn-gacha-10').disabled = (takanekoPoints < COST_10 || gachaImages.length === 0);
        }

        function drawGacha(times) {
            const cost = times === 1 ? COST_1 : COST_10;
            if (takanekoPoints < cost) {
                showModal("エラー", "ポイントが足りません！");
                return;
            }
            if (gachaImages.length === 0) {
                showModal("エラー", "ガチャの中身が設定されていません。");
                return;
            }

            takanekoPoints -= cost;
            
            const results = [];
            for (let i = 0; i < times; i++) {
                const randomIndex = Math.floor(Math.random() * gachaImages.length);
                const item = gachaImages[randomIndex];
                results.push(item);
                
                if (!collectedImages.includes(item.id)) {
                    collectedImages.push(item.id);
                }
            }
            saveGachaData();

            const resultArea = document.getElementById('gacha-result-area');
            const resultGrid = document.getElementById('gacha-result-grid');
            resultGrid.innerHTML = "";
            resultArea.style.display = 'block';

            results.forEach((item, index) => {
                const delay = index * 0.1;
                resultGrid.innerHTML += `
                    <div class="gacha-item-wrapper">
                        <img src="${item.src}" class="gacha-item" style="animation-delay: ${delay}s" onclick="openImageModal(this.src)" onerror="this.style.display='none'; this.nextElementSibling.innerText='画像なし'">
                        <div class="gacha-item-title" style="animation-delay: ${delay}s; opacity:0; animation: fadeIn 0.5s forwards;">${item.name}</div>
                    </div>
                `;
            });
            
            renderCollection();
        }

        function toggleCollection() {
            const colArea = document.getElementById('collection-area');
            if(colArea.style.display === 'block') {
                colArea.style.display = 'none';
            } else {
                renderCollection();
                colArea.style.display = 'block';
            }
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = "";
            
            gachaImages.forEach(item => {
                if (collectedImages.includes(item.id)) {
                    grid.innerHTML += `<img src="${item.src}" class="collection-img" title="${item.name}" onclick="openImageModal(this.src)" onerror="this.style.display='none'">`;
                } else {
                    grid.innerHTML += `<div class="collection-locked" title="未獲得">?</div>`;
                }
            });

            const isCompleted = gachaImages.length > 0 && collectedImages.length >= gachaImages.length;
            const completeMsgObj = document.getElementById('collection-complete-msg');

            if (isCompleted) {
                if (!completeMsgObj) {
                    const colArea = document.getElementById('collection-area');
                    const compMsg = document.createElement('div');
                    compMsg.id = 'collection-complete-msg';
                    compMsg.className = 'complete-message';
                    compMsg.innerHTML = "✨ COMPLETE!! ✨";
                    colArea.appendChild(compMsg);
                }
            } else {
                if (completeMsgObj) {
                    completeMsgObj.remove();
                }
            }
        }

        /* --- デベロッパーモード --- */
        function showDevPasswordPrompt() {
            showModal("デベロッパー認証", "開発者用パスワードを入力してください。", true, () => {
                const pass = document.getElementById('modal-password').value;
                if (pass === "takanekokonneko") {
                    isDevMode = true;
                    localStorage.setItem('isDevMode', 'true');
                    document.getElementById('dev-settings').style.display = 'block';
                    showModal("認証成功", "デベロッパーモードが有効になりました。");
                } else {
                    showModal("エラー", "パスワードが違います。");
                }
            });
        }

        function setDevPoints() {
            const val = document.getElementById('dev-pt-input').value;
            takanekoPoints = parseInt(val) || 0;
            saveGachaData();
            showModal("完了", `ポイントを ${takanekoPoints} pt に設定しました。`);
        }

        function resetGachaData() {
            if(confirm("ガチャのポイントとコレクションをすべてリセットします。よろしいですか？")) {
                takanekoPoints = 0;
                collectedImages = [];
                isDevMode = false;
                localStorage.removeItem('isDevMode');
                localStorage.removeItem('lastLoginDate');
                saveGachaData();
                document.getElementById('dev-settings').style.display = 'none';
                showModal("完了", "データをリセットしました。");
            }
        }


        /* --- 用語辞典とアーカイブ描画 --- */
        function getYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|live\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function renderTerms() {
            const container = document.getElementById('terms-container');
            container.innerHTML = termsData.map((data, index) => {
                const delay = index * 0.1;
                let clipHtml = '';
                if (data.clipUrl) {
                    const videoId = getYouTubeId(data.clipUrl);
                    const thumbnailHtml = videoId ? `<img src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" alt="サムネイル" class="video-thumbnail" onclick="openImageModal(this.src)" onerror="this.src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg'">` : '';
                    clipHtml = `${thumbnailHtml}<div class="clip-container"><a href="${data.clipUrl}" target="_blank" class="action-btn">切り抜き動画を見る</a><span class="clip-time">(${data.clipSeconds})</span></div>`;
                }
                return `<div class="card" style="animation-delay: ${delay}s"><div class="card-header" onclick="this.parentElement.classList.toggle('open')"><span class="term-title">${data.term}</span><span class="toggle-icon">▼</span></div><div class="details-wrapper"><div class="details-inner"><div class="details-content"><p><strong>説明：</strong><br>${data.explanation}</p><p><strong>登場した配信：</strong> ${data.streamName}</p>${clipHtml}</div></div></div></div>`;
            }).join('');
        }

        // 引数 filterGame によって表示するアーカイブを絞り込む
        function renderArchives(filterGame = "all") {
            const container = document.getElementById('archives-container');
            
            // 初回のみフィルターの選択肢(プルダウン)を生成
            if(!isArchiveFilterInitialized) {
                const filterSelect = document.getElementById('archive-filter');
                // ゲーム名の一覧を重複なく取得
                const games = [...new Set(archivesData.map(d => d.game))].filter(Boolean);
                games.forEach(game => {
                    const option = document.createElement('option');
                    option.value = game;
                    option.textContent = game;
                    filterSelect.appendChild(option);
                });
                isArchiveFilterInitialized = true;
            }

            // フィルター処理
            const filteredData = filterGame === "all" 
                ? archivesData 
                : archivesData.filter(data => data.game === filterGame);

            container.innerHTML = filteredData.map((data, index) => {
                // 絞り込み時はアニメーションのディレイを短くする
                const delay = index * 0.05;
                const descText = data.explanation ? data.explanation : "説明はありません。";
                const videoId = getYouTubeId(data.streamUrl);
                const thumbnailHtml = videoId ? `<img src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" alt="サムネイル" class="video-thumbnail" onclick="openImageModal(this.src)" onerror="this.src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg'">` : '';
                return `<div class="card" style="animation-delay: ${delay}s"><div class="card-header" onclick="this.parentElement.classList.toggle('open')"><div class="archive-basic-info"><span class="archive-title">${data.title}</span><span class="archive-date">${data.date}</span></div><span class="toggle-icon">▼</span></div><div class="details-wrapper"><div class="details-inner"><div class="details-content">${thumbnailHtml}<p><strong>ゲーム名：</strong> ${data.game}</p><p><strong>説明：</strong><br>${descText}</p><div style="text-align: center; margin-top: 20px;"><a href="${data.streamUrl}" target="_blank" class="action-btn">本編配信を見に行く</a></div></div></div></div></div>`;
            }).join('');
            
            // 絞り込み結果が0件の場合
            if(filteredData.length === 0) {
                container.innerHTML = "<p>該当するアーカイブはありません。</p>";
            }
        }

        /* --- ローカル動画プレイヤー --- */
        function renderLocalVideos() {
            const container = document.getElementById('local-videos-container');
            if(videosData.length === 0) {
                container.innerHTML = "<p>現在公開されている動画はありません。</p>";
                return;
            }
            container.innerHTML = videosData.map((video, index) => {
                const delay = index * 0.1;
                const playerId = `player-${index}`;
                return `
                    <div class="card custom-player-wrapper" style="animation-delay: ${delay}s">
                        <div class="player-title">${video.title}</div>
                        <div class="video-container">
                            <video id="${playerId}" class="video-element" src="${video.filename}"></video>
                            <div class="custom-controls" id="controls-${playerId}">
                                <button class="ctrl-btn play-pause-btn" onclick="togglePlay('${playerId}')">▶ 再生</button>
                                <div class="progress-bar-container">
                                    <span class="time-display" id="current-time-${playerId}">00:00</span>
                                    <input type="range" class="progress-bar" id="progress-${playerId}" value="0" min="0" max="100" step="0.1" oninput="seekVideo('${playerId}', this.value)">
                                    <span class="time-display" id="duration-${playerId}">00:00</span>
                                </div>
                                <div class="ctrl-options">
                                    <div class="ctrl-options-left">
                                        <select class="ctrl-select" onchange="changeSpeed('${playerId}', this.value)">
                                            <option value="0.1">0.1x</option><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="0.75">0.75x</option>
                                            <option value="1" selected>1.0x (標準)</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option>
                                            <option value="2">2.0x</option><option value="3">3.0x</option><option value="5">5.0x</option>
                                        </select>
                                        <label class="repeat-label"><input type="checkbox" onchange="toggleLoop('${playerId}', this.checked)"> リピート</label>
                                    </div>
                                    <div class="ctrl-options-right">
                                        <div class="volume-container">
                                            🔊 <input type="range" class="volume-bar" id="volume-${playerId}" value="1" min="0" max="2" step="0.1" oninput="changeVolume('${playerId}', this.value)">
                                            <span id="volume-text-${playerId}" style="width: 35px; text-align: right;">1.0x</span>
                                        </div>
                                        <button class="ctrl-btn" onclick="toggleFullScreen('${playerId}')">⛶ 全画面</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            videosData.forEach((_, index) => {
                const playerId = `player-${index}`;
                const video = document.getElementById(playerId);
                const progressBar = document.getElementById(`progress-${playerId}`);
                const currentDisplay = document.getElementById(`current-time-${playerId}`);
                const durationDisplay = document.getElementById(`duration-${playerId}`);
                const playBtn = video.parentElement.querySelector('.play-pause-btn');

                video.addEventListener('loadedmetadata', () => { durationDisplay.textContent = formatTime(video.duration); });
                video.addEventListener('timeupdate', () => {
                    if (!video.duration) return;
                    progressBar.value = (video.currentTime / video.duration) * 100;
                    currentDisplay.textContent = formatTime(video.currentTime);
                });
                video.addEventListener('ended', () => { if(!video.loop) playBtn.textContent = '▶ 再生'; });
                
                ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(event => {
                    video.addEventListener(event, () => handleFullscreenChange(video));
                });
            });
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function togglePlay(playerId) {
            const video = document.getElementById(playerId);
            const btn = document.getElementById(`controls-${playerId}`).querySelector('.play-pause-btn');
            initAudioContext(playerId);
            if (video.paused) { video.play(); btn.textContent = '⏸ 一時停止'; } 
            else { video.pause(); btn.textContent = '▶ 再生'; }
        }

        function initAudioContext(playerId) {
            if (audioContexts[playerId]) return;
            try {
                const video = document.getElementById(playerId);
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const source = ctx.createMediaElementSource(video);
                const gainNode = ctx.createGain();
                gainNode.gain.value = parseFloat(document.getElementById(`volume-${playerId}`).value);
                source.connect(gainNode); gainNode.connect(ctx.destination);
                audioContexts[playerId] = { ctx, gainNode };
            } catch (e) { console.error(e); }
        }

        function changeVolume(playerId, value) {
            document.getElementById(`volume-text-${playerId}`).textContent = parseFloat(value).toFixed(1) + "x";
            if (audioContexts[playerId]) {
                audioContexts[playerId].gainNode.gain.value = parseFloat(value);
            } else {
                document.getElementById(playerId).volume = value > 1 ? 1 : value;
            }
        }

        function seekVideo(playerId, value) {
            const video = document.getElementById(playerId);
            if (video.duration) video.currentTime = video.duration * (value / 100);
        }
        function changeSpeed(playerId, speed) { document.getElementById(playerId).playbackRate = parseFloat(speed); }
        function toggleLoop(playerId, isLoop) { document.getElementById(playerId).loop = isLoop; }
        
        function toggleFullScreen(playerId) {
            const video = document.getElementById(playerId);
            if (video.requestFullscreen) video.requestFullscreen();
            else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
            else if (video.msRequestFullscreen) video.msRequestFullscreen();
        }
        
        function handleFullscreenChange(video) {
            const isFs = document.fullscreenElement === video || document.webkitFullscreenElement === video || document.mozFullScreenElement === video || document.msFullscreenElement === video;
            video.controls = isFs;
        }
    </script>
</body>
</html>
